[package]
name = "substreams-database-change"
version = "4.0.0"
edition = "2021"
description = "Substreams database change containg helpers"
authors = ["StreamingFast Contributors <team@streamingfast.io>"]
license = "Apache-2.0"
homepage = "https://substreams.streamingfast.io/"
repository = "https://github.com/streamingfast/substreams-sink-database-changes"
readme = "README.md"
keywords = ["substreams", "streamingfast", "firehose", "thegraph", "entity"]
categories = ["api-bindings", "external-ffi-bindings", "wasm"]

[dependencies]
buffa = { version = "0.9", default-features = false, features = ["std", "fast-utf8", "json"] }
buffa-types = { version = "0.9", default-features = false, features = ["std"] }
substreams = { version = "0.8.0-beta" }

[dev-dependencies]
pretty_assertions = "1.4"
